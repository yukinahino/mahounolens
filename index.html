<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>まほうのレンズ</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="start-screen">

    <div class="start-content">

      <p class="event-name">
        えほんpicnic
      </p>

      <h1 class="start-title">
        まほうのレンズ
      </h1>

      <p class="start-lead">
        きょうは、えほんピクニックのひ。<br>
        うつぼこうえんにあつまった<br>
        えほんたちが、にげだしちゃった！
      </p>

      <p class="start-story">
        「まほうのレンズ」をつかって、<br>
        いなくなったえほんを<br>
        さがしにいこう。
      </p>

      <button
        id="start-button"
        class="start-button"
        type="button"
      >
        まほうのレンズをひらく
      </button>

      <p class="permission-note">
        ※この体験ではカメラと位置情報を使用します。
      </p>

      <p
        id="location-error"
        class="location-error"
        hidden
      >
        ここでは、まほうのレンズをひらけないみたい。<br>
        靱公園に行ってみよう！
      </p>

    </div>

  </main>

  <script src="js/start.js"></script>

</body>
</html>
