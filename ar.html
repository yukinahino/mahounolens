<!DOCTYPE html>
<html lang="ja">

<style>
    /* =========================
       AR配置調整パネル
       debug=true のときのみ表示
    ========================== */

    #ar-debug-panel {
        display: none;

        position: fixed;
        z-index: 9999;

        right: 12px;
        bottom: 12px;
        left: auto;

        width: min(340px, calc(100vw - 24px));
        max-height: 48vh;

        overflow-y: auto;

        background: rgba(255, 255, 255, 0.92);
        color: #222;

        padding: 10px;

        border-radius: 12px;

        font-family: sans-serif;
        font-size: 13px;

        box-sizing: border-box;

        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    }

    #ar-debug-panel h3 {
        margin: 0 0 10px;
        font-size: 16px;
    }

    .debug-preview {
        position: relative;
        width: 100%;
        max-width: 420px;
        margin: 10px auto;
        overflow: hidden;
        background: #ddd;
    }

    #debug-marker-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
    }

    #debug-character-image {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        pointer-events: none;
    }

    .debug-row {
        display: grid;
        grid-template-columns: 70px 1fr 55px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
    }

    .debug-row input[type="range"] {
        width: 100%;
    }

    .debug-buttons {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    #debug-output {
        margin-top: 10px;
        padding: 8px;
        background: #eee;
        font-size: 12px;
        word-break: break-all;
    }

    #debug-target-select,
    #debug-marker-file {
        width: 100%;
        margin-bottom: 8px;
    }

    /* =========================
       マーカー認識後のAR固定表示
       ========================== */
    #ar-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
    }

    #overlay-character {
        position: absolute;
        left: 50%;
        top: 52%;
        width: 42vw;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        pointer-events: none;
    }

    #ar-action-buttons {
    position: fixed;
    z-index: 30;

    left: 50%;
    bottom: 32px;

    transform: translateX(-50%);

    display: flex;
    gap: 12px;

    width: calc(100% - 32px);
    max-width: 420px;

    justify-content: center;
    align-items: center;
}

#ar-action-buttons[hidden] {
    display: none;
}

#ar-action-buttons .end-button {
    position: static;
    left: auto;
    right: auto;
    bottom: auto;
    transform: none;

    flex: 1;

    padding: 12px 16px;

    border: 0;
    border-radius: 999px;

    font: inherit;
    cursor: pointer;

    min-width: 0;
}

</style>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>まほうのレンズ</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR + A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/ar.css">
</head>

<body>

    <!-- ARシーン -->
    <a-scene mindar-image="
      imageTargetSrc: assets/markers/targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    " embedded color-space="sRGB" renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    " vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <!-- 使用する画像 -->
        <a-assets>
            <img id="ar-slide" src="assets/images/ar_slide02.png">
            <img id="ar-flower" src="assets/images/ar_flower02.png">
            <img id="ar-horse" src="assets/images/ar_horse02.png">
            <img id="ar-water" src="assets/images/ar_water02.png">
        </a-assets>
        <!-- MindARで認識するターゲット -->
        <!--
            新仕様：
            マーカーはARキャラクターの「表示位置」ではなく、
            どのキャラクターを表示するか判定するためのONスイッチとして使う。

            targetIndex:
            0 = すべり台
            1 = 花形トンネル
            2 = 馬
            3 = 水飲み場
        -->

        <!-- すべり台 -->
        <a-entity id="target-slide" class="ar-target" data-character="slide" mindar-image-target="targetIndex: 0">
        </a-entity>

        <!-- 花形トンネル -->
        <a-entity id="target-flower" class="ar-target" data-character="flower" mindar-image-target="targetIndex: 1">
        </a-entity>

        <!-- 馬 -->
        <a-entity id="target-horse" class="ar-target" data-character="horse" mindar-image-target="targetIndex: 2">
        </a-entity>

        <!-- 水飲み場 -->
        <a-entity id="target-water" class="ar-target" data-character="water" mindar-image-target="targetIndex: 3">
        </a-entity>



        <!-- ARカメラ -->
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse"
            raycaster="objects: .clickable; far: 10000">
        </a-camera>
    </a-scene>

    <!--
        マーカー認識後に表示するARキャラクター。
        MindARターゲットから切り離し、画面上へ固定表示する。
        app.js 側で src を切り替える。
    -->
    <div id="ar-overlay" hidden>
        <img id="overlay-character" src="" alt="ARえほん">
    </div>

    <div id="screenshot-guide" class="screenshot-guide" hidden>
        みつけた！<br>
        スクリーンショットで<br>
        いっしょに しゃしんを とろう！
    </div>

    <div id="ar-action-buttons" hidden>

        <button id="next-book-button" class="end-button" type="button">
            もういちどさがす
        </button>

        <button id="finish-button" class="end-button" type="button">
            おわる
        </button>

    </div>

    <!-- ======================================
     AR配置調整パネル
     ar.html?debug=true のときのみ表示
    ======================================= -->
    <div id="ar-debug-panel">

        <h3>AR配置調整</h3>

        <select id="debug-target-select">
            <option value="horse">馬</option>
            <option value="water">水飲み場</option>
        </select>

        <!-- X -->
        <div class="debug-row">
            <label>X</label>
            <input id="debug-x" type="range" min="0" max="100" step="1">
            <span id="debug-x-value"></span>
        </div>

        <!-- Y -->
        <div class="debug-row">
            <label>Y</label>
            <input id="debug-y" type="range" min="0" max="100" step="1">
            <span id="debug-y-value"></span>
        </div>

        <!-- サイズ -->
        <div class="debug-row">
            <label>サイズ</label>
            <input id="debug-width" type="range" min="10" max="100" step="1">
            <span id="debug-width-value"></span>
        </div>

        <!-- 回転 -->
        <div class="debug-row">
            <label>回転</label>
            <input id="debug-rotation" type="range" min="-180" max="180" step="1">
            <span id="debug-rotation-value"></span>
        </div>

        <div class="debug-buttons">

            <label>
                <input id="debug-flip-x" type="checkbox">
                左右反転
            </label>

            <label>
                <input id="debug-flip-y" type="checkbox">
                上下反転
            </label>

        </div>

        <div id="debug-output"></div>

    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
