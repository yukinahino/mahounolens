<!DOCTYPE html>
<html lang="ja">

<style>
    /* =========================
       AR配置調整パネル
       debug=true のときのみ表示
    ========================== */

    #ar-debug-panel {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-height: 92vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.96);
        color: #222;
        padding: 12px;
        border-radius: 12px;
        font-family: sans-serif;
        box-sizing: border-box;
    }

    #ar-debug-panel h3 {
        margin: 0 0 10px;
        font-size: 16px;
    }

    .debug-preview {
        position: relative;
        width: 100%;
        max-width: 420px;
        margin: 10px auto;
        overflow: hidden;
        background: #ddd;
    }

    #debug-marker-image {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
    }

    #debug-character-image {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: center center;
        pointer-events: none;
    }

    .debug-row {
        display: grid;
        grid-template-columns: 70px 1fr 55px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
    }

    .debug-row input[type="range"] {
        width: 100%;
    }

    .debug-buttons {
        display: flex;
        gap: 12px;
        margin-top: 8px;
    }

    #debug-output {
        margin-top: 10px;
        padding: 8px;
        background: #eee;
        font-size: 12px;
        word-break: break-all;
    }

    #debug-target-select,
    #debug-marker-file {
        width: 100%;
        margin-bottom: 8px;
    }

    /* =========================
       マーカー認識後のAR固定表示
       ========================== */
    #ar-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
    }

    #overlay-character {
        position: absolute;
        left: 50%;
        top: 52%;
        width: 42vw;
        max-width: 280px;
        transform: translate(-50%, -50%);
        transform-origin: center center;
        pointer-events: none;
    }

    #next-book-button {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%);
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        cursor: pointer;
    }

</style>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>まほうのレンズ</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR + A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/ar.css">
</head>

<body>

    <!-- ARシーン -->
    <a-scene mindar-image="
      imageTargetSrc: assets/markers/targets.mind;
      autoStart: true;
      uiLoading: yes;
      uiScanning: yes;
      uiError: yes;
    " embedded color-space="sRGB" renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    " vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <!-- 使用する画像 -->
        <a-assets>
            <img id="ar-slide" src="assets/images/ar_slide02.png">
            <img id="ar-flower" src="assets/images/ar_flower02.png">
            <img id="ar-horse" src="assets/images/ar_horse02.png">
            <img id="ar-water" src="assets/images/ar_water02.png">
        </a-assets>
        <!-- MindARで認識するターゲット -->
        <!--
            新仕様：
            マーカーはARキャラクターの「表示位置」ではなく、
            どのキャラクターを表示するか判定するためのONスイッチとして使う。

            targetIndex:
            0 = すべり台
            1 = 花形トンネル
            2 = 馬
            3 = 水飲み場
        -->

        <!-- すべり台 -->
        <a-entity
            id="target-slide"
            class="ar-target"
            data-character="slide"
            mindar-image-target="targetIndex: 0">
        </a-entity>

        <!-- 花形トンネル -->
        <a-entity
            id="target-flower"
            class="ar-target"
            data-character="flower"
            mindar-image-target="targetIndex: 1">
        </a-entity>

        <!-- 馬 -->
        <a-entity
            id="target-horse"
            class="ar-target"
            data-character="horse"
            mindar-image-target="targetIndex: 2">
        </a-entity>

        <!-- 水飲み場 -->
        <a-entity
            id="target-water"
            class="ar-target"
            data-character="water"
            mindar-image-target="targetIndex: 3">
        </a-entity>



        <!-- ARカメラ -->
        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse"
            raycaster="objects: .clickable; far: 10000">
        </a-camera>
    </a-scene>

    <!--
        マーカー認識後に表示するARキャラクター。
        MindARターゲットから切り離し、画面上へ固定表示する。
        app.js 側で src を切り替える。
    -->
    <div id="ar-overlay" hidden>
        <img id="overlay-character" src="" alt="ARえほん">
    </div>

    <div id="screenshot-guide" class="screenshot-guide" hidden>
        みつけた！<br>
        スクリーンショットで<br>
        いっしょに しゃしんを とろう！
    </div>

    <button id="next-book-button" class="end-button" type="button" hidden>
        つぎの えほんを さがす
    </button>

    <!-- ======================================
     AR配置調整パネル
     ar.html?debug=true のときのみ表示
======================================= -->
    <div id="ar-debug-panel">

        <h3>AR配置調整モード</h3>

        <!-- 調整対象 -->
        <select id="debug-target-select">
            <option value="slide">index0：すべり台</option>
            <option value="flower">index1：花形トンネル</option>
            <option value="horse">index2：馬</option>
            <option value="water">index3：水飲み場</option>
        </select>

        <!-- マーカー画像 -->
        <label>
            マーカー画像を選択
            <input id="debug-marker-file" type="file" accept="image/*">
        </label>

        <!-- プレビュー -->
        <div id="debug-preview" class="debug-preview">

            <img id="debug-marker-image" alt="マーカー">

            <img id="debug-character-image" alt="ARキャラクター">

        </div>


        <!-- X -->
        <div class="debug-row">
            <label>X</label>
            <input id="debug-x" type="range" min="-2" max="2" step="0.01">
            <span id="debug-x-value"></span>
        </div>

        <!-- Y -->
        <div class="debug-row">
            <label>Y</label>
            <input id="debug-y" type="range" min="-2" max="2" step="0.01">
            <span id="debug-y-value"></span>
        </div>

        <!-- Z -->
        <div class="debug-row">
            <label>Z</label>
            <input id="debug-z" type="range" min="-1" max="1" step="0.01">
            <span id="debug-z-value"></span>
        </div>

        <!-- width -->
        <div class="debug-row">
            <label>Width</label>
            <input id="debug-width" type="range" min="0.1" max="4" step="0.01">
            <span id="debug-width-value"></span>
        </div>

        <!-- height -->
        <div class="debug-row">
            <label>Height</label>
            <input id="debug-height" type="range" min="0.1" max="4" step="0.01">
            <span id="debug-height-value"></span>
        </div>

        <!-- rotation Z -->
        <div class="debug-row">
            <label>回転</label>
            <input id="debug-rotation" type="range" min="-180" max="180" step="1">
            <span id="debug-rotation-value"></span>
        </div>


        <!-- 反転 -->
        <div class="debug-buttons">

            <label>
                <input id="debug-flip-x" type="checkbox">
                左右反転
            </label>

            <label>
                <input id="debug-flip-y" type="checkbox">
                上下反転
            </label>

        </div>


        <!-- 最終コード -->
        <div id="debug-output"></div>

    </div>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
