<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>まほうのレンズ</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="end-screen">

    <div class="end-content">

      <h1 class="end-title">
        みつけた！
      </h1>

      <p class="end-message">
        えほんをみつけてくれて、ありがとう。<br>
        きょうのぼうけんを<br>
        しゃしんにのこしておこう。
      </p>

      <p class="screenshot-guide">
        スクリーンショットを撮って、<br>
        思い出として保存してね。
      </p>

      <p class="hashtag">
        #まほうのレンズ<br>
        #えほんpicnic
      </p>

      <button
        id="retry-button"
        class="retry-button"
        type="button"
      >
        もう一度さがす
      </button>

      <button
        id="top-button"
        class="top-button"
        type="button"
      >
        はじめにもどる
      </button>

    </div>

  </main>

  <script src="js/end.js"></script>

</body>
</html>
